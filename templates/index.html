<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projectile-Thing</title>
    <style>
        html { background-color: black; color: white; }
        h1, h2 { color: #ffffff; }
        p { text-align: center; }
        .controller-status {
            text-align: center;
            font-family: sans-serif;
            font-size: 0.9rem;
            color: #888888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <p>
        <img src="{{ url_for('static', filename='logo.png') }}" height="20%" width="20%" alt="Logo">
    </p>
    
    <form id="shootForm" action="{{ url_for('shoot') }}" method="post" style="text-align: center;">
        <button type="submit">Shoot</button>
    </form>
     <form id="moveForm" action="{{ url_for('move') }}" method="post" style="text-align: center;">
        <button type="submit">Move</button>
    </form>
    <div id="status" class="controller-status">Connect controller and press the trigger to shoot</div>
    <p>
        <button id="enableSound" type="button">Enable sound</button>
        <span id="audioStatus" role="status">Enable sound before using the controller.</span>
    </p>

    <script>
        const form = document.getElementById('shootForm');
        const form1 = document.getElementById('moveForm');
        const statusDiv = document.getElementById('status');
        const enableSoundButton = document.getElementById('enableSound');
        const audioStatus = document.getElementById('audioStatus');
        let audioContext;
        let shootBufferPromise;
        let wasAPressed = false;
        let wasBPressed = false;


        async function prepareShootSound(enableAudio = false) {
            try {
                audioContext ??= new AudioContext();
                let resumePromise;
                if (audioContext.state === 'suspended') {
                    if (!enableAudio) {
                        audioStatus.textContent = 'Click Enable sound to allow controller audio.';
                        return null;
                    }
                    // Call resume during the click, before awaiting the sound file.
                    resumePromise = audioContext.resume();
                }
                if (!shootBufferPromise) {
                    shootBufferPromise = fetch("{{ url_for('static', filename='pew.mp3') }}")
                        .then(response => {
                            if (!response.ok) throw new Error(`Sound request failed: ${response.status}`);
                            return response.arrayBuffer();
                        })
                        .then(data => audioContext.decodeAudioData(data))
                        .catch(error => {
                            shootBufferPromise = undefined;
                            throw error;
                        });
                }
                const [buffer] = await Promise.all([shootBufferPromise, resumePromise]);
                if (audioContext.state !== 'running') {
                    audioStatus.textContent = 'Click Enable sound to allow controller audio.';
                    return null;
                }
                audioStatus.textContent = 'Sound enabled.';
                return buffer;
            } catch (error) {
                audioStatus.textContent = 'Could not enable sound. Click Enable sound to retry.';
                console.warn('Could not prepare shoot sound:', error);
                return null;
            }
        }

        enableSoundButton.addEventListener('click', () => prepareShootSound(true));

        async function playShootSound(enableAudio) {
            const buffer = await prepareShootSound(enableAudio);
            if (!buffer) return;

            // Buffers are reusable, but every shot needs a separate playback source.
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.onended = () => source.disconnect();
            source.start();
        }

        function triggerShoot(enableAudio = false) {
            statusDiv.textContent = "Shooting!";
            playShootSound(enableAudio);
            fetch("{{ url_for('shoot') }}", { method: 'POST' });
        }

        function triggerMove() {
            statusDiv.textContent = "Moving!";
            fetch("{{ url_for('move') }}", { method: 'POST' });
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault(); // Prevents the browser from reloading the page
            triggerShoot(true);
        });

        
        function pollGamepad() {
            const gamepads = navigator.getGamepads();
            
            // pretty sure this finds the gamepad
            const controller = Array.from(gamepads).find(gp => gp !== null);
            
            if (controller) {
                const buttonA = controller.buttons[7];
                const buttonB = controller.buttons[1];

                if (buttonA) {
                    // updates the status if it was connected
                    statusDiv.textContent = `Controller Connected!`;

                    if (buttonA.pressed && !wasAPressed) {
                        triggerShoot();
                        if (controller && controller.vibrationActuator) {
                            controller.vibrationActuator.playEffect('dual-rumble', {
                            duration: 200,          // Duration in milliseconds
                            startDelay: 0,          // Delay before starting in ms
                            strongMagnitude: 1,   // Low-frequency motor (0.0 to 1.0)
                            weakMagnitude: 0.8      // High-frequency buzz motor (0.0 to 1.0)
                         });
                        }
                    }

                    wasAPressed = buttonA.pressed;
                }

                if (buttonB) {
                    if (buttonB.pressed && !wasBPressed) {
                        statusDiv.textContent = "B";
                        form1.submit();
                    }

                    wasBPressed = buttonB.pressed;
                }
            }
            requestAnimationFrame(pollGamepad);
        }

        window.addEventListener('gamepadconnected', (e) => {
            console.log("Gamepad connected:", e.gamepad.id);
        });
        pollGamepad();
    </script>
</body>
</html>
